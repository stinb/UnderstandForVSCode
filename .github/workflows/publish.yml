name: Publish

# Jenkins starts this from Understand_Release » accept with the build it
# accepted. The .vsix is the one that build packaged and smoke tested, so
# nothing is rebuilt here. The Marketplace's Trusted Publishing policy names
# this file, so renaming it stops Marketplace publishing (#55).
on:
  workflow_dispatch:
    inputs:
      build:
        description: Understand build number, e.g. 1267
        required: true
      commit:
        description: Commit of this repo the .vsix was packaged from
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      BUILD: ${{ inputs.build }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "build must be a number: $BUILD"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full SHA: $COMMIT"; exit 1; }
          echo "VERSION=8.0.$BUILD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the .vsix
        run: |
          curl -fsSL -o understand.vsix "https://builds.scitools.com/all_builds/b$BUILD/Understand/understand-vscode-$VERSION.vsix"
          unzip -p understand.vsix extension/package.json | jq -e --arg v "$VERSION" '.version == $v'

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath understand.vsix --skip-duplicate

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish understand.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Tag and attach the .vsix to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "v$VERSION" understand.vsix --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" --title "$VERSION" --notes "For Understand build $BUILD."
